<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct DashScope Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 48px 64px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }
        h1 {
            font-size: 2.4rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
        }
        .badge {
            display: inline-block;
            background: rgba(0, 200, 255, 0.2);
            border: 1px solid rgba(0, 200, 255, 0.4);
            border-radius: 40px;
            padding: 6px 20px;
            font-size: 0.85rem;
            color: #7ecfff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .check {
            margin-top: 24px;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Direct DashScope works!</h1>
        <span class="badge">✅ DashScope • DeepSeek V4 Flash</span>
        <div class="check">🚀</div>
    </div>
</body>
</html>
